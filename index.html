<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cours de maths</title>
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6f5f1;--card:#fff;--ink:#1d1f24;--muted:#6b6f78;--line:#e3e1da;--accent:#2f5bd3}
@media (prefers-color-scheme:dark){:root{--bg:#16181c;--card:#1f2228;--ink:#eceef2;--muted:#9aa0aa;--line:#30343c;--accent:#7f9cf5}}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:640px;margin:0 auto;padding:40px 16px}
h1{font-size:28px;margin:0 0 6px}
p{color:var(--muted);margin:0 0 24px}
a.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 20px;color:var(--ink);text-decoration:none}
a.card:hover,a.card:focus{border-color:var(--accent)}
a.card b{display:block;font-size:20px;margin-bottom:2px}
a.card span{color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Cours de maths</h1>
  <p>Les jeux d'introduction de chaque séance.</p>
  <a class="card" href="seance-1/"><b>Séance 1 · La machine</b><span>Les fonctions : deviner la règle, calculer et placer les points, tracer la courbe.</span></a>
  <a class="card" href="seance-2/" style="margin-top:12px"><b>Séance 2 · Le traducteur de paraboles</b><span>Traduire une consigne, régler a, h et k, lire les signes, construire une parabole pas à pas.</span></a>
</div>
</body>
</html>
